[workspace]
members = [".", "crates/conda-monitor"]
resolver = "2"

[package]
name = "siglog"
version = "0.1.0"
edition = "2021"
description = "A minimal Tessera-compatible transparency log server"
license = "BSD-3-Clause"
repository = "https://github.com/prefix-dev/siglog"
homepage = "https://github.com/prefix-dev/siglog"
readme = "README.md"
keywords = ["transparency", "log", "merkle", "sigstore", "tessera"]
categories = ["cryptography", "command-line-utilities"]

[lib]
name = "siglog"
path = "src/lib.rs"

[[bin]]
name = "siglog"
path = "src/main.rs"

[[bin]]
name = "witness"
path = "src/bin/witness.rs"

[[bin]]
name = "siglog-import"
path = "src/bin/import.rs"

[dependencies]
# Web framework
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "timeout"] }
tower = "0.5"
tower_governor = "0.8"

# Storage
opendal = { version = "0.51", features = ["services-s3", "services-memory", "services-fs"] }
sea-orm = { version = "1.1", features = ["runtime-tokio-rustls", "sqlx-postgres", "sqlx-sqlite"] }
sea-orm-migration = { version = "1.1", features = ["runtime-tokio-rustls", "sqlx-postgres", "sqlx-sqlite"] }
chrono = { version = "0.4", features = ["serde"] }

# Merkle tree (path dependencies from sigstore-rust)
sigstore-merkle = "0.6.0"
sigstore-types = "0.6.0"
sigstore-crypto = "0.6.0"

# CLI and config
clap = { version = "4", features = ["derive", "env"] }

# Cryptography
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"

# Serialization
base64 = "0.22"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async utilities
async-trait = "0.1"
async-recursion = "1"
futures = "0.3"

# HTTP client for CLI tools
reqwest = { version = "0.13", features = ["json", "blocking"] }
indicatif = "0.18.3"

# Optimization
smallvec = "1.13"

# WAL entry checksums
crc32fast = "1"

[profile.release]
# Size/index arithmetic guards the Merkle tree and witness rollback
# protection; wrap-on-overflow must never silently corrupt those checks.
overflow-checks = true

[dev-dependencies]
tempfile = "3"
portpicker = "0.1"
wiremock = "0.6"
tower = "0.5"
