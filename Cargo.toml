[workspace]
members = [".", "crates/conda-monitor"]
resolver = "2"

[package]
name = "siglog"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "A minimal Tessera-compatible transparency log server"
license = "BSD-3-Clause"
repository = "https://github.com/prefix-dev/siglog"
homepage = "https://github.com/prefix-dev/siglog"
readme = "README.md"
keywords = ["transparency", "log", "merkle", "sigstore", "tessera"]
categories = ["cryptography", "command-line-utilities"]

[lib]
name = "siglog"
path = "src/lib.rs"

[[bin]]
name = "siglog"
path = "src/main.rs"

[[bin]]
name = "siglog-import"
path = "src/bin/import.rs"

[[bin]]
name = "witness"
path = "src/bin/witness.rs"

[dependencies]
# Web framework
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["cors", "trace", "timeout"] }
crc32fast = "1.5"
tower = "0.5"
tower_governor = "0.8"

# Storage
opendal = { version = "0.59.2", features = ["services-s3", "services-memory", "services-fs"] }
sea-orm = { version = "2.0", features = ["runtime-tokio-rustls", "sqlx-postgres", "sqlx-sqlite"] }
sea-orm-migration = { version = "2.0", features = ["runtime-tokio-rustls", "sqlx-postgres", "sqlx-sqlite"] }
chrono = { version = "0.4", features = ["serde"] }

# Merkle tree (path dependencies from sigstore-rust)
sigstore-merkle = "0.11"
sigstore-types = "0.11"
sigstore-crypto = "0.11"

# CLI and config
clap = { version = "4", features = ["derive", "env"] }

# Cryptography
# Already used by sigstore-crypto; direct access for prehashed verification and strict DER parsing.
aws-lc-rs = "1.15"
x509-cert = "0.3"
ed25519-dalek = { version = "3", features = ["rand_core", "digest"] }
rand = "0.10"
sha2 = "0.11"

# Serialization
base64 = "0.23"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async utilities
async-trait = "0.1"
async-recursion = "1"
futures = "0.3"

# HTTP client for CLI tools
reqwest = { version = "0.13", features = ["json", "blocking"] }
indicatif = "0.18.3"

# Optimization
smallvec = "1.13"

[dev-dependencies]
tempfile = "3"
portpicker = "0.1"
wiremock = "0.6"
tower = "0.5"

[profile.release]
overflow-checks = true
