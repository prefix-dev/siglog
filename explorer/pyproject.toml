[project]
name = "tessera-explorer"
version = "0.1.0"
description = "A TUI for exploring Tessera transparency logs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.47.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
]

[project.scripts]
tessera-explorer = "app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
