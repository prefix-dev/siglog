[package]
name = "conda-monitor"
version = "0.1.0"
edition = "2021"
description = "A monitoring witness for Conda package transparency logs"
license = "BSD-3-Clause"

[[bin]]
name = "conda-monitor"
path = "src/bin/main.rs"

[[bin]]
name = "conda-log-ingest"
path = "src/bin/ingest.rs"

[[bin]]
name = "conda-log-verify"
path = "src/bin/verify.rs"

[dependencies]
# Core tessera library
rust-tessera = { path = "../.." }

# Web framework
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Database
sea-orm = { version = "1.1", features = ["runtime-tokio-rustls", "sqlx-postgres", "sqlx-sqlite"] }
sea-orm-migration = { version = "1.1", features = ["runtime-tokio-rustls", "sqlx-postgres", "sqlx-sqlite"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Cryptography
sha2 = "0.10"

# Serialization
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async
async-trait = "0.1"

# HTTP client
reqwest = { version = "0.12", features = ["json", "blocking"] }
indicatif = "0.17"

[dev-dependencies]
tempfile = "3"
